name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Representative maintained interpreter within requires-python = ">=3.8".
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,render,sync]"

      - name: Tests
        run: python -m pytest -q

      - name: CLI smoke checks
        run: |
          scroll-anchor --help
          scroll-anchor analyze-render --help
          scroll-anchor render-report --help
          scroll-anchor map-render-candidates --help
